[project]
name = "beam_engine"
version = "0.1.0"
description = "Fast beam search engine for LLM decoding — paged-attention and tree-attention baselines."
requires-python = "==3.11.*"
dependencies = [
    "torch==2.9.0",
    "flashinfer-python",
    "transformers==4.57.3",
    "ninja",
    "accelerate>=1.12.0",
    "safetensors",
    "huggingface_hub",
    "numpy",
    # Adds torch-side DLPack exchange API used by tvm_ffi's typed-FFI bridge,
    # which flashinfer's append_paged_kv_cache and attention kernels go
    # through. Required to dispatch on float8_e4m3 (the fp8-KV path on
    # Llama-3-70B-FP8); torch 2.9 doesn't ship the C exchange API natively.
    "torch-c-dlpack-ext>=0.1.5",
]

[tool.uv]
no-build-isolation-package = ["torch"]

[tool.uv.sources]
flashinfer-python = { path = "3rdparty/flashinfer", editable = true }

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
