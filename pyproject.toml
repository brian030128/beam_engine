[project]
name = "beam_engine"
version = "0.1.0"
description = "Fast beam search engine for LLM decoding — paged-attention and tree-attention baselines."
requires-python = "==3.11.*"
dependencies = [
    "torch==2.9.0",
    "flashinfer-python",
    "transformers==4.57.3",
    "ninja",
    "accelerate>=1.12.0",
    "safetensors",
    "huggingface_hub",
    "numpy",
]

[tool.uv]
no-build-isolation-package = ["torch"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
